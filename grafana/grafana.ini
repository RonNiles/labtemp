# Lab temperature Grafana. Port 3001 (the Memory Machine X Grafana on this host is on 8092).
[server]
http_port = 3001

[paths]
data = /data/grafana
logs = /data/grafana/log
plugins = /data/grafana/plugins
provisioning = /etc/labtemp/grafana/provisioning

[security]
admin_user = admin
admin_password = $__file{/data/secrets/grafana-admin}

[auth.anonymous]
enabled = true
org_role = Viewer

[dashboards]
default_home_dashboard_path = /etc/labtemp/grafana/dashboards/lab-temp.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[log]
mode = console
level = warn
