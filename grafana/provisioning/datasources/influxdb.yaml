apiVersion: 1
datasources:
  - name: InfluxDB
    uid: labtemp-influx
    type: influxdb
    access: proxy
    url: http://localhost:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: lab
      defaultBucket: labtemp
    secureJsonData:
      token: $__file{/data/secrets/influx-token}
