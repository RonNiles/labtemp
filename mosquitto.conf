# Unauthenticated broker for the Tasmota sensor (lab networks only).
# Installed as /etc/mosquitto/labtemp.conf: the host's AppArmor profile for /usr/sbin/mosquitto also applies inside
# the container and only allows config under /etc/mosquitto. Persistence is off (QoS 0 telemetry, nothing retained),
# which also keeps the broker out of /data, where the profile won't let it write.
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
