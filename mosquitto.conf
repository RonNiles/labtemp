# Broker for the Tasmota sensor. Logins: tasmota (the sensor), subscriber (subscriber.py), admin (Ron).
# Passwords live in /data/secrets/mqtt-<user>; entrypoint.sh hashes them into labtemp.passwd at start.
# Installed under /etc/mosquitto: the host's AppArmor profile for /usr/sbin/mosquitto also applies inside
# the container and only allows reading config there. Persistence is off (QoS 0 telemetry, nothing retained),
# which also keeps the broker out of /data, where the profile won't let it write.
listener 1883 0.0.0.0
allow_anonymous false
password_file /etc/mosquitto/labtemp.passwd
acl_file /etc/mosquitto/labtemp.acl
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
